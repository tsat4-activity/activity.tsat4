<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TSAT4 Activity</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <section class="login-shell" id="login">
    <button class="theme-toggle login-theme" type="button" data-theme-login title="สลับโหมดมืด/สว่าง" aria-label="สลับธีม">
      <span class="material-symbols-rounded login-theme-icon">light_mode</span>
    </button>
    <form class="login-card" id="login-form">
      <div class="login-head">
        <div class="login-mark material-symbols-rounded">event</div>
        <h1>TSAT4 Activity</h1>
        <p>ระบบกิจกรรม 5S · CFO · SMF</p>
      </div>
      <div class="field"><label class="required">รหัสพนักงาน</label><input name="employeeId" autocomplete="username" required></div>
      <div class="field"><label class="required">รหัสผ่าน</label>
        <div class="pw-wrap">
          <input name="password" type="password" autocomplete="current-password" required>
          <button class="icon-btn pw-toggle" type="button" data-pw-toggle title="แสดงรหัสผ่าน" aria-label="แสดงรหัสผ่าน"><span class="material-symbols-rounded">visibility</span></button>
        </div>
      </div>
      <p class="form-error" id="login-error"></p>
      <div class="form-actions">
        <button class="btn btn-primary" type="submit">เข้าสู่ระบบ</button>
      </div>
    </form>
  </section>

  <section class="login-shell d-none" id="password-gate">
    <button class="theme-toggle login-theme" type="button" data-theme-login title="สลับโหมดมืด/สว่าง" aria-label="สลับธีม">
      <span class="material-symbols-rounded login-theme-icon">light_mode</span>
    </button>
    <form class="login-card" id="password-form">
      <div class="login-head">
        <div class="login-mark material-symbols-rounded">lock_reset</div>
        <h1>เปลี่ยนรหัสผ่าน</h1>
        <p>ครบกำหนด 90 วัน ตั้งรหัสใหม่ก่อนใช้งานต่อ อย่างน้อย 8 ตัว</p>
      </div>
      <div class="field"><label class="required">รหัสผ่านเดิม</label>
        <div class="pw-wrap">
          <input name="current" type="password" autocomplete="current-password" required>
          <button class="icon-btn pw-toggle" type="button" data-pw-toggle title="แสดงรหัสผ่าน" aria-label="แสดงรหัสผ่าน"><span class="material-symbols-rounded">visibility</span></button>
        </div>
      </div>
      <div class="field"><label class="required">รหัสผ่านใหม่</label>
        <div class="pw-wrap">
          <input name="password" type="password" autocomplete="new-password" minlength="8" required>
          <button class="icon-btn pw-toggle" type="button" data-pw-toggle title="แสดงรหัสผ่าน" aria-label="แสดงรหัสผ่าน"><span class="material-symbols-rounded">visibility</span></button>
        </div>
      </div>
      <p class="form-error" id="password-error"></p>
      <div class="form-actions">
        <button class="btn btn-secondary" type="button" id="password-logout">ออกจากระบบ</button>
        <button class="btn btn-primary" type="submit">บันทึกรหัสใหม่</button>
      </div>
    </form>
  </section>

  <div class="d-none" id="shell">
    <header class="app-header">
      <div class="header-brand">
        <div class="header-logo" id="header-logo" aria-hidden="true"></div>
        <div class="header-company">
          <strong id="header-company-en" class="header-company-en">TSAT4 Activity</strong>
          <span id="header-company-th" class="header-company-th">ชื่อบริษัท (ภาษาไทย)</span>
        </div>
      </div>
      <div class="header-page">
        <strong id="header-page-title">ภาพรวม</strong>
        <span id="header-page-subtitle"></span>
      </div>
      <div class="header-right">
        <div class="header-meta" id="header-meta"></div>
        <div class="header-user-block">
          <strong id="header-user-name" class="header-user-name"></strong>
          <span class="header-user-meta"><span id="header-user-id"></span> · <span id="header-user-role"></span></span>
        </div>
        <button class="icon-btn sidebar-open-mobile" type="button" id="sidebar-open-mobile" aria-label="เปิดเมนู" title="เมนู">
          <span class="material-symbols-rounded">menu</span>
        </button>
        <button class="theme-toggle" type="button" id="theme-toggle" title="สลับโหมดมืด/สว่าง" aria-label="สลับธีม">
          <span id="theme-icon" class="material-symbols-rounded">light_mode</span>
        </button>
        <div class="user-menu" id="user-menu">
          <button class="user-avatar" type="button" id="user-menu-btn" aria-label="ผู้ใช้">
            <span class="material-symbols-rounded">person</span>
          </button>
          <div class="user-pop">
            <strong id="header-user"></strong>
            <span id="header-role"></span>
            <button class="btn btn-secondary" type="button" id="my-access-btn">สิทธิ์ของฉัน</button>
            <button class="btn btn-secondary" type="button" id="change-pw-btn">เปลี่ยนรหัสผ่าน</button>
            <button class="btn btn-secondary" type="button" id="logout">ออกจากระบบ</button>
          </div>
        </div>
      </div>
    </header>
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <button class="icon-btn sidebar-toggle" type="button" id="sidebar-toggle" aria-label="ย่อ/ขยายเมนู" title="ย่อ/ขยายเมนู">
          <span id="sidebar-toggle-icon" class="material-symbols-rounded">left_panel_close</span>
        </button>
        <span class="sidebar-top-title">เมนู</span>
      </div>
      <button class="nav-btn" data-view="main" title="TSAT4 Activity"><span class="material-symbols-rounded">home</span><span>หน้าหลัก</span></button>
      <div class="nav-acc" data-nav-acc="activity">
        <div class="nav-split">
          <button class="nav-btn nav-parent" type="button" data-view="activity" title="Activity">
            <span class="material-symbols-rounded">event</span><span>ระบบกิจกรรม</span>
          </button>
          <button class="nav-caret-btn" type="button" data-nav-toggle="activity" aria-expanded="true" aria-label="ย่อระบบกิจกรรม" title="ย่อ/ขยาย">
            <span class="material-symbols-rounded nav-caret">expand_more</span>
          </button>
        </div>
        <div class="nav-sub" data-nav-panel="activity"></div>
      </div>
      <div class="nav-acc" data-nav-acc="setup">
        <div class="nav-split">
          <button class="nav-btn nav-parent" type="button" data-view="setup" title="ระบบตั้งค่า">
            <span class="material-symbols-rounded">settings</span><span>ระบบตั้งค่า</span>
          </button>
          <button class="nav-caret-btn" type="button" data-nav-toggle="setup" aria-expanded="true" aria-label="ย่อระบบตั้งค่า" title="ย่อ/ขยาย">
            <span class="material-symbols-rounded nav-caret">expand_more</span>
          </button>
        </div>
        <div class="nav-sub" data-nav-panel="setup">
          <button class="nav-btn" data-view="act-plan" title="ปฏิทิน"><span class="material-symbols-rounded">calendar_month</span><span>ปฏิทิน</span></button>
        </div>
      </div>
      <div class="nav-system d-none" data-system="1">
        <button class="nav-btn" data-view="access" title="สิทธิ์ผู้ใช้"><span class="material-symbols-rounded">manage_accounts</span><span>สิทธิ์ผู้ใช้</span></button>
        <button class="nav-btn" data-view="system" title="Setting"><span class="material-symbols-rounded">settings</span><span>Setting</span></button>
      </div>
    </aside>
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
    <main class="main">
      <div class="app-view" id="app-view"></div>
    </main>
  </div>
  <div class="toast-stack" id="toasts"></div>
  <!-- Load order matters: core first, boot last. All scripts share one global scope. -->
  <script src="/js/core.js"></script>
  <script src="/js/units.js"></script>
  <script src="/js/act.js"></script>
  <script src="/js/act-5s.js"></script>
  <script src="/js/act-tx.js"></script>
  <script src="/js/act-planner.js"></script>
  <script src="/js/act-cfo.js"></script>
  <script src="/js/act-workflow.js"></script>
  <script src="/js/access.js"></script>
  <script src="/js/system.js"></script>
  <script src="/js/boot.js"></script>
</body>
</html>
